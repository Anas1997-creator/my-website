<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HomeCare360 by L. Brooke Homes — Looking after your home, one season at a time</title>
<meta name="description" content="HomeCare360 is the home care membership from L. Brooke Homes. We schedule the upkeep, keep the record of what was done, and give you one place to see what is coming.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Noto+Sans:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#171717; --bg2:#1b1b1b; --card:#262626; --line:rgba(255,255,255,.1); --line2:rgba(255,255,255,.18);
  --text:#fafafa; --muted:#a3a3a3; --soft:#d4d4d4; --light:#ebebeb; --accent:#86d3a0;
  --radius:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:"Noto Sans",Figtree,sans-serif;font-weight:600;line-height:1.15;letter-spacing:-.005em}
a{color:inherit;text-decoration:none}
svg.i{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap{max-width:1160px;margin:0 auto;padding:0 24px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;cursor:pointer;font:600 15.5px Figtree,sans-serif;padding:14px 26px;border-radius:999px;transition:.2s}
.btn-light{background:var(--light);color:#111}
.btn-light:hover{background:#fff;transform:translateY(-1px)}
.btn-ghost{background:rgba(255,255,255,.1);color:var(--text)}
.btn-ghost:hover{background:rgba(255,255,255,.18)}
.eyebrow{font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;color:var(--muted)}

/* header */
header{position:sticky;top:0;z-index:50;background:rgba(27,27,27,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;height:64px;gap:16px}
.logo{display:flex;align-items:center;gap:12px;font:600 14px "Noto Sans",sans-serif;letter-spacing:.08em;text-transform:uppercase}
.logo img{width:34px;height:34px;object-fit:contain}
.logo span small{display:block;font:500 10.5px Figtree;letter-spacing:.18em;color:var(--muted);margin-top:1px}
.nav ul{display:flex;gap:28px;list-style:none;font-size:14.5px;font-weight:500;color:var(--soft)}
.nav ul a:hover{color:#fff}
.call{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.1);padding:9px 16px;border-radius:10px;font-size:14px;font-weight:500}
.call:hover{background:rgba(255,255,255,.18)}

/* hero */
.hero{position:relative;padding:56px 0 64px;background:#111 url("https://lbh-os-e8671.web.app/hc360/hero-linden-lane.jpg") center/cover no-repeat}
.hero:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(17,17,17,.92) 0%,rgba(17,17,17,.72) 55%,rgba(17,17,17,.55) 100%)}
.hero:after{content:"";position:absolute;left:0;right:0;bottom:0;height:90px;background:linear-gradient(transparent,var(--bg))}
.hero .wrap{position:relative;z-index:1}
.hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:48px;align-items:center}
.hero h1{font-size:clamp(34px,4.6vw,56px);font-weight:500;margin:14px 0 18px}
.hero p.lead{font-size:18px;color:var(--soft);max-width:520px;font-weight:500}
.checks{list-style:none;margin:24px 0 0;display:grid;gap:11px}
.checks li{display:flex;gap:11px;align-items:center;font-weight:500;color:var(--text);font-size:15.5px}
.checks svg{font-size:19px;color:var(--accent)}
.trust{display:flex;gap:22px;flex-wrap:wrap;margin-top:28px;font-size:13.5px;color:var(--muted)}
.trust span{display:flex;align-items:center;gap:8px}
.trust svg{font-size:16px}

/* form */
.formcard{background:rgba(27,27,27,.96);border:1px solid var(--line2);border-radius:20px;padding:28px;box-shadow:0 30px 70px -25px rgba(0,0,0,.8)}
.formcard h2{font-size:24px}
.formcard .sub{color:var(--muted);font-size:14.5px;margin:6px 0 18px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12.5px;font-weight:600;margin-bottom:5px;color:var(--soft)}
.field input,.field select{width:100%;font:500 15.5px Figtree;padding:13px 14px;border:1px solid var(--line2);border-radius:10px;background:var(--card);color:var(--text);outline:none;transition:.15s}
.field input::placeholder{color:#737373}
.field input:focus,.field select:focus{border-color:#fff;background:#2d2d2d}
.field select option{background:#262626}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.formcard .btn{width:100%;margin-top:6px;padding:15px}
.fine{font-size:12px;color:var(--muted);text-align:center;margin-top:12px}
.success{display:none;text-align:center;padding:26px 6px}
.success .tick{width:60px;height:60px;border-radius:50%;background:rgba(134,211,160,.14);color:var(--accent);display:grid;place-items:center;font-size:28px;margin:0 auto 14px}
.formcard.done form{display:none}.formcard.done .success{display:block}
.err{color:#f87171;font-size:12px;margin-top:4px;display:none}
.field.bad input{border-color:#f87171}.field.bad .err{display:block}
.hp{position:absolute;left:-9999px;opacity:0}

/* photo rows — free-licence (Unsplash) task photos */
const U=id=>`https://images.unsplash.com/${id}?auto=format&fit=crop&w=700&q=70`;
const R1=[["roller","Touch up paint","photo-1693985120993-e9b203ce7631"],["shield","Install smart lock","photo-1558002038-1055907df827"],["drop","Replace toilet","photo-1589824783837-6169889fa20f"],["sun","Stain deck","photo-1792782418351-77a679ef408b"],["zap","Swap light fixture","photo-1540932239986-30128078f3c5"],["sun","Clean gutters","photo-1665442350373-c8e7fc6560de"],["monitor","Mount TV","photo-1567690187548-f07b1d7bf5a9"]];
const R2=[["drop","Fix leaky faucet","photo-1542013936693-884638332954"],["window","Repair door hinge","photo-1744329630135-06bb9d5e02a0"],["wifi","Smart thermostat","photo-1545259741-2ea3ebf61fa3"],["zap","Replace outlets","photo-1610056494071-9373f12bf769"],["clip","Caulk & seal","photo-1607400201515-c2c41c07d307"],["clip","Install & assemble","photo-1562259929-b4e1fd3aef09"],["shield","General repairs","photo-1645651964715-d200ce0939cc"]];
const tile=t=>`<div class="tile"><img src="${U(t[2])}" alt="${t[1]}" loading="lazy"><div class="cap">${ic(t[0])}${t[1]}</div></div>`;
const fill=(id,arr)=>{const h=arr.map(tile).join("");document.getElementById(id).innerHTML=h+h;};
fill("row1",R1);fill("row2",R2);

document.getElementById("yr").textContent=new Date().getFullYear();

/* prefill from URL: ?name=&phone=&email=&address=&plan= */
const qp=new URLSearchParams(location.search);
["name","phone","email","address"].forEach(k=>{if(qp.get(k))document.getElementById(k).value=qp.get(k)});
if(qp.get("plan")){const s=document.getElementById("plan");[...s.options].forEach(o=>{if(o.text.toLowerCase()===qp.get("plan").toLowerCase())s.value=o.text})}
document.querySelectorAll("[data-plan]").forEach(a=>a.addEventListener("click",()=>{document.getElementById("plan").value=a.dataset.plan}));

/* form */
const form=document.getElementById("leadForm");
const rules={name:v=>v.trim().length>1,phone:v=>v.replace(/\D/g,"").length>=10,email:v=>/^\S+@\S+\.\S+$/.test(v),address:v=>v.trim().length>3};
form.addEventListener("submit",async e=>{
  e.preventDefault();
  if(document.getElementById("company").value)return; // honeypot
  let ok=true;
  for(const k in rules){const el=document.getElementById(k);const good=rules[k](el.value);el.parentElement.classList.toggle("bad",!good);if(!good)ok=false}
  if(!ok)return;
  const data=Object.fromEntries(new FormData(form).entries());delete data.company;
  ["utm_source","utm_medium","utm_campaign"].forEach(k=>{if(qp.get(k))data[k]=qp.get(k)});
  data.source="hc360-landing";data.submitted_at=new Date().toISOString();
  const btn=form.querySelector("button");const label=btn.innerHTML;btn.disabled=true;btn.textContent="Sending…";
  try{
    if(FORM_ENDPOINT){
      const r=await fetch(FORM_ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json"},body:JSON.stringify(data)});
      if(!r.ok)throw new Error("bad response");
    }else{console.log("DEMO MODE – lead not sent. Set FORM_ENDPOINT.",data);await new Promise(r=>setTimeout(r,500));}
    document.getElementById("okmsg").textContent=`Thank you ${data.name.split(" ")[0]}. A HomeCare360 coordinator will contact you within one business day.`;
    document.getElementById("signup").classList.add("done");
  }catch(err){btn.disabled=false;btn.innerHTML=label;alert("Sorry, something went wrong. Please try again or call (609) 200-0403.");}
});
</script>
</body>
</html>
